<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidMTX - YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0; 
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid rgba(255,0,0,0.3);
        }
        .logo { font-size: 36px; font-weight: 800; color: #ff0000; }
        
        .alert {
            background: #ff6b6b;
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            line-height: 1.8;
        }
        .alert strong { font-size: 16px; display: block; margin-bottom: 10px; }
        .alert a { color: #fff; }
        
        label { display: block; margin: 15px 0 8px; font-weight: 600; color: #ff0000; }
        input, textarea {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ff0000;
        }
        textarea { 
            min-height: 150px; 
            font-family: monospace; 
            font-size: 11px;
            /* SEMPRE VISÍVEL - SEM display:none */
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-red { background: linear-gradient(135deg, #ff0000, #cc0000); color: #fff; }
        .btn-cyan { background: linear-gradient(135deg, #03dac6, #00b4a0); color: #000; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .result {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .error { color: #ff6b6b; }
        
        .spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid rgba(255,0,0,0.3);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">▶️ VidMTX</div>
        </div>
        
        <div class="alert">
            <strong> Cookies OBRIGATÓRIOS para YouTube:</strong>
            1. Instale: <a href="https://chromewebstore.google.com/detail/get-cookiestxt-locally/cclelndahbckbenkjhflpdbgdldlbecc" target="_blank">Get cookies.txt</a><br>
            2. Acesse youtube.com e faça login<br>
            3. Clique na extensão → Exportar cookies<br>
            4. Copie TODO o conteúdo e cole abaixo
        </div>
        
        <label>URL do YouTube:</label>
        <input type="url" id="url" placeholder="https://youtube.com/watch?v=...">
        
        <label>Cookies (obrigatório - cole o conteúdo do arquivo cookies.txt):</label>
        <textarea id="cookies" placeholder=".youtube.com	TRUE	/	TRUE	1234567890	__Secure-3PAPISID	abc123..."></textarea>
        
        <div class="btn-row">
            <button class="btn btn-red" onclick="download('mp4')">📥 Download MP4</button>
            <button class="btn btn-red" onclick="download('mp3')">🎵 Download MP3</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-cyan" onclick="transcribe()">📝 Transcrever</button>
            <button class="btn btn-cyan" onclick="downloadTxt()">📄 Baixar TXT</button>
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const API = "https://vdmtx-backend.onrender.com";
        
        function showResult(msg, err=false) {
            const r = document.getElementById('result');
            r.classList.add('show');
            r.innerHTML = msg;
            r.className = 'result ' + (err ? 'error' : '');
        }
        
        async function download(fmt) {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url) { alert('Cole a URL do YouTube'); return; }
            if (cookies.length < 100) { alert('Cole os cookies primeiro (campo acima)'); return; }
            
            showResult('<span class="spinner"></span>Processando...');
            
            try {
                const r = await fetch(`${API}/download`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, format: fmt, cookies})
                });
                
                if (r.ok) {
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `video.${fmt}`;
                    a.click();
                    showResult('✅ Download concluído!');
                } else {
                    const e = await r.json();
                    showResult('❌ ' + e.detail, true);
                }
            } catch(e) {
                showResult('❌ Erro de conexão', true);
            }
        }
        
        async function transcribe() {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url || cookies.length < 100) { alert('Preencha URL e cookies'); return; }
            
            showResult('<span class="spinner"></span>Transcrevendo...');
            
            const r = await fetch(`${API}/transcribe`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, format: 'mp3', cookies})
            });
            
            const d = await r.json();
            if (d.formatted) {
                showResult('<strong>Transcrição:</strong><br><br>' + d.formatted);
                navigator.clipboard.writeText(d.formatted);
            } else {
                showResult('❌ ' + (d.detail || 'Erro'), true);
            }
        }
        
        async function downloadTxt() {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url || cookies.length < 100) { alert('Preencha URL e cookies'); return; }
            
            const r = await fetch(`${API}/download-transcription`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, format: 'mp3', cookies})
            });
            
            if (r.ok) {
                const blob = await r.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'transcricao.txt';
                a.click();
            }
        }
    </script>
</body>
</html>
