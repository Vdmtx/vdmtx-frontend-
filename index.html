<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidMTX - YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0; 
            min-height: 100vh;
        }
        .header {
            background: rgba(255, 0, 0, 0.15);
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
            text-align: center;
        }
        .logo { font-size: 32px; font-weight: 800; color: #ff0000; }
        .container { padding: 20px; max-width: 700px; margin: 0 auto; }
        .alert {
            background: #ff6b6b;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .alert.show { display: block; }
        input, textarea {
            width: 100%;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            margin-bottom: 12px;
            font-size: 15px;
        }
        textarea { min-height: 120px; font-family: monospace; font-size: 11px; display: none; }
        textarea.show { display: block; }
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-red { background: linear-gradient(135deg, #ff0000, #cc0000); color: #fff; }
        .btn-cyan { background: linear-gradient(135deg, #03dac6, #00b4a0); color: #000; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #ffb700); color: #000; }
        .result {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .spinner { 
            display: inline-block; 
            width: 20px; height: 20px; 
            border: 3px solid rgba(255,0,0,0.3); 
            border-top-color: #ff0000; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">▶️ VidMTX</div>
        <div style="color:#888;margin-top:6px">YouTube Downloader Pro</div>
    </div>
    
    <div class="container">
        <div class="alert" id="alert">
            <strong>YouTube requer cookies:</strong><br>
            1. Instale "Get cookies.txt" no Chrome<br>
            2. Acesse youtube.com<br>
            3. Exporte cookies e cole abaixo
        </div>
        
        <input type="url" id="url" placeholder="🔗 URL do YouTube">
        
        <button class="btn" style="background:rgba(255,255,255,0.1);color:#fff" onclick="toggleCookies()">
            🍪 Adicionar Cookies (obrigatório)
        </button>
        
        <textarea id="cookies" placeholder="Cole os cookies aqui..."></textarea>
        
        <div class="btn-row">
            <button class="btn btn-red" onclick="download('mp4')">📥 MP4</button>
            <button class="btn btn-red" onclick="download('mp3')">🎵 MP3</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-cyan" onclick="transcribe()">📝 Transcrever</button>
            <button class="btn btn-cyan" onclick="downloadTxt()">📄 Baixar TXT</button>
        </div>
        
        <div class="result" id="result"></div>
    </div>

    <script>
        const API = "https://vdmtx-backend.onrender.com";
        
        function toggleCookies() {
            const t = document.getElementById('cookies');
            const a = document.getElementById('alert');
            t.classList.toggle('show');
            a.classList.toggle('show');
        }
        
        function showResult(msg, err=false) {
            const r = document.getElementById('result');
            r.classList.add('show');
            r.innerHTML = msg;
            r.style.color = err ? '#ff6b6b' : '#e0e0e0';
        }
        
        async function download(fmt) {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url) return alert('Cole uma URL');
            if (!cookies || cookies.length < 100) {
                alert('Adicione cookies primeiro!');
                toggleCookies();
                return;
            }
            
            showResult('<span class="spinner"></span> Baixando...');
            
            try {
                const r = await fetch(`${API}/download`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, format: fmt, cookies})
                });
                
                if (r.ok) {
                    const blob = await r.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `video.${fmt}`;
                    a.click();
                    showResult('✅ Download concluído!');
                } else {
                    const e = await r.json();
                    showResult(`❌ ${e.detail}`, true);
                }
            } catch(e) {
                showResult('❌ Erro de conexão', true);
            }
        }
        
        async function transcribe() {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url || cookies.length < 100) return alert('Preencha URL e cookies');
            
            showResult('<span class="spinner"></span> Transcrevendo...');
            
            try {
                const r = await fetch(`${API}/transcribe`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, format: 'mp3', cookies})
                });
                
                const d = await r.json();
                if (d.formatted) {
                    showResult('<strong>Transcrição:</strong><br><br>' + d.formatted);
                    navigator.clipboard.writeText(d.formatted);
                } else if (d.detail) {
                    showResult(`❌ ${d.detail}`, true);
                }
            } catch(e) {
                showResult('❌ Erro', true);
            }
        }
        
        async function downloadTxt() {
            const url = document.getElementById('url').value.trim();
            const cookies = document.getElementById('cookies').value.trim();
            
            if (!url || cookies.length < 100) return alert('Preencha URL e cookies');
            
            const r = await fetch(`${API}/download-transcription`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url, format: 'mp3', cookies})
            });
            
            if (r.ok) {
                const blob = await r.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'transcricao.txt';
                a.click();
            }
        }
    </script>
</body>
</html>
