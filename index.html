<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>VidMTX - Downloader Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0; 
            min-height: 100vh;
            padding-bottom: 80px;
        }
        .header {
            background: rgba(187, 134, 252, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px 16px;
            border-bottom: 1px solid rgba(187, 134, 252, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #bb86fc 0%, #03dac6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            letter-spacing: -1px;
        }
        .tagline { text-align: center; font-size: 12px; color: #888; margin-top: 4px; }
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }
        .input-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input::placeholder { color: #666; }
        .platforms {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .platforms::-webkit-scrollbar { display: none; }
        .platform-chip {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: linear-gradient(135deg, #bb86fc 0%, #9955e8 100%); color: #000; }
        .btn-secondary { background: linear-gradient(135deg, #03dac6 0%, #00b4a0 100%); color: #000; }
        .btn-full { grid-column: 1 / -1; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); color: #fff; }
        .result {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        .result.show { display: block; }
        .result-title { font-size: 13px; color: #bb86fc; margin-bottom: 8px; font-weight: 600; }
        .result-text {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .btn-download-txt {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }
        .loading { display: flex; align-items: center; gap: 10px; color: #bb86fc; font-size: 14px; }
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(187, 134, 252, 0.3);
            border-top-color: #bb86fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            border: 1px solid rgba(187, 134, 252, 0.3);
        }
        .toast.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎬 VidMTX</div>
        <div class="tagline">Downloader Pro • Sem anúncios • Com transcrição</div>
    </div>
    
    <div class="container">
        <div class="input-group">
            <input type="url" id="url" placeholder="🔗 Cole o link do vídeo aqui..." autocomplete="off">
        </div>
        
        <div class="platforms">
            <div class="platform-chip">▶️ YouTube</div>
            <div class="platform-chip">🎵 TikTok</div>
            <div class="platform-chip">📷 Instagram</div>
            <div class="platform-chip">🐦 Twitter</div>
            <div class="platform-chip">📺 Bilibili</div>
            <div class="platform-chip">🎬 Douyin</div>
            <div class="platform-chip"> Kwai</div>
            <div class="platform-chip">+1000</div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="downloadVideo('mp4')"> MP4</button>
            <button class="btn btn-primary" onclick="downloadVideo('mp3')">🎵 MP3</button>
            <button class="btn btn-secondary" onclick="transcribeVideo()">📝 Transcrever</button>
            <button class="btn btn-secondary" onclick="downloadTranscription()">📄 Baixar TXT</button>
        </div>
        
        <div id="result" class="result">
            <div class="result-title">Resultado</div>
            <div id="resultText" class="result-text"></div>
            <button id="btnDownloadTxt" class="btn-download-txt" style="display:none;" onclick="downloadTranscription()">
                📄 Baixar transcrição completa (.txt)
            </button>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script>
        const API = "https://vdmtx-backend.onrender.com";
        
        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }
        
        function showResult(msg, isError = false) {
            const result = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            result.classList.add('show');
            resultText.innerHTML = msg;
            resultText.style.color = isError ? '#ff6b6b' : '#e0e0e0';
        }
        
        function hideResult() {
            document.getElementById('result').classList.remove('show');
            document.getElementById('btnDownloadTxt').style.display = 'none';
        }
        
        async function downloadVideo(format) {
            const url = document.getElementById('url').value.trim();
            if (!url) { showToast('⚠️ Cole um link primeiro'); return; }
            
            showResult('<div class="loading"><div class="spinner"></div>Processando (tentando múltiplas estratégias)...</div>');
            
            window.location.href = `${API}/download?url=${encodeURIComponent(url)}&format=${format}`;
            setTimeout(() => {
                showResult('✅ Download iniciado! Verifique sua pasta de downloads.');
                showToast('Download iniciado!');
            }, 1500);
        }
        
        async function transcribeVideo() {
            const url = document.getElementById('url').value.trim();
            if (!url) { showToast('️ Cole um link primeiro'); return; }
            
            showResult('<div class="loading"><div class="spinner"></div>Baixando e transcrevendo...</div>');
            
            try {
                const r = await fetch(`${API}/transcribe?url=${encodeURIComponent(url)}`);
                const d = await r.json();
                
                if (d.detail) {
                    showResult(`❌ ${d.detail}`, true);
                    showToast('Erro na transcrição');
                    return;
                }
                
                if (d.formatted) {
                    showResult(' <strong>Transcrição:</strong><br><br>' + d.formatted);
                    document.getElementById('btnDownloadTxt').style.display = 'block';
                    showToast('Transcrição concluída!');
                    
                    navigator.clipboard.writeText(d.formatted).then(() => {
                        showToast('Texto copiado para área de transferência!');
                    }).catch(() => {});
                }
            } catch(e) {
                showResult('❌ Erro de conexão. Aguarde 30s e tente.', true);
                showToast('Erro de conexão');
            }
        }
        
        async function downloadTranscription() {
            const url = document.getElementById('url').value.trim();
            if (!url) { showToast('⚠️ Cole um link primeiro'); return; }
            
            showToast('⏳ Gerando arquivo TXT...');
            window.location.href = `${API}/download-transcription?url=${encodeURIComponent(url)}`;
            setTimeout(() => showToast('📄 Download do TXT iniciado!'), 2000);
        }
        
        document.getElementById('url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') downloadVideo('mp4');
        });
    </script>
</body>
</html>
